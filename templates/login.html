{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card" style="padding: 22px; max-width: 420px; margin: 0 auto;">
        <h2 style="text-align: center;">Log In</h2>

        {% if notice %}
            <p class="res-message">{{ notice }}</p>
        {% endif %}

        {% if error %}
            <div class="flash">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label style="font-weight: bold; font-size: 0.9rem;">Email</label>
            <input type="email" name="email" value="{{ email }}" required autocomplete="email" placeholder="you@example.com">

            <label style="font-weight: bold; font-size: 0.9rem;">Password</label>
            <input type="password" name="password" required autocomplete="current-password" placeholder="Your password">

            <label style="display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.92rem; font-weight: 600;">
                <input type="checkbox" name="remember" style="width: auto; margin: 0;">
                Remember me on this device
            </label>

            <button type="submit" class="btn btn-primary cta">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 16px;">
            No account yet?
            <a href="/signup" style="color: var(--primary); font-weight: bold;">Sign up here</a>
        </p>
        <p style="text-align: center; margin-top: 8px;">
            Forgot it?
            <a href="/reset_password" style="color: var(--primary); font-weight: bold;">Reset your password</a>
        </p>
        <p style="text-align: center; margin-top: 8px;">
            Teaching here?
            <a href="/admin/login" style="color: var(--primary); font-weight: bold;">Admin log in</a>
        </p>
    </div>
</div>
<script src="/static/auth.js" defer></script>
{% endblock %}
